name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholarship_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service container above - DB-dependent tests run for
      # real in CI instead of self-skipping. JWT_SECRET_KEY stays a CI-only
      # dummy; nothing reads it as a real secret.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scholarship_ci
      JWT_SECRET_KEY: dummy-ci-secret-not-real

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: uv run pytest

      # Scored, threshold-gated checks distinct from the pytest step above
      # (constitution Principle V). Phase 1 gates matching-correctness
      # (threshold 1.0 - Principle II zero-tolerance) and qa-groundedness.
      - name: Run eval score-gate
        working-directory: backend
        run: uv run python -m evals.runner
