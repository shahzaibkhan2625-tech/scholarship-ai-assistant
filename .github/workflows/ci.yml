name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # Dummy values so app.main / app.core.config can be imported during test
      # collection without crashing. They intentionally cannot connect to a
      # real database - DB-dependent tests skip themselves when a real
      # connection isn't available.
      DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost/dummy
      JWT_SECRET_KEY: dummy-ci-secret-not-real

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run tests
        working-directory: backend
        run: uv run pytest

      # Scored, threshold-gated checks distinct from the pytest step above
      # (constitution Principle V). Phase 1 gates matching-correctness
      # (threshold 1.0 - Principle II zero-tolerance) and qa-groundedness.
      - name: Run eval score-gate
        working-directory: backend
        run: uv run python -m evals.runner
