name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholarship_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service container above - DB-dependent tests run for
      # real in CI instead of self-skipping. JWT_SECRET_KEY stays a CI-only
      # dummy; nothing reads it as a real secret.
      # The app and the tests run as the restricted role; only Alembic uses the owner URL.
      DATABASE_URL: postgresql+psycopg://scholarship_app:ci-only-not-a-secret@localhost:5432/scholarship_ci # allow-secret: CI-only throwaway password
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scholarship_ci
      JWT_SECRET_KEY: ci-only-dummy-secret-0123456789abcdef

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      # Least-privilege role (010 US3, FR-DBROLE-4): migrate as the owner, run everything else as
      # scholarship_app, so the whole suite proves the app needs no DDL. The role is created before
      # the first migration (tables then get default privileges) and the script is re-run after it
      # (grants on existing tables, alembic_version and audit_log). psql is preinstalled on
      # ubuntu-latest; the version line below makes a missing client obvious on the first run.
      - name: Create restricted database role
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -v migration_role=postgres -v skip_password=1 -f backend/scripts/db/create_app_role.sql
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE scholarship_app PASSWORD 'ci-only-not-a-secret'" # allow-secret: CI-only throwaway password
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: scholarship_ci

      - name: Run database migrations (as owner)
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Re-run role script after migrations
        run: >-
          psql -v ON_ERROR_STOP=1 -v migration_role=postgres -v skip_password=1
          -f backend/scripts/db/create_app_role.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: scholarship_ci

      - name: Run tests
        working-directory: backend
        run: uv run pytest

      # Dependency vulnerability gate (US8 T234, NFR-HARDEN-8, constitution Principle V).
      # pip-audit has no severity filter, so the gate is "no known vulnerability" and every
      # exception is an explicit, justified --ignore-vuln. Both ignores below have NO upstream
      # fix version and were checked against the full advisory text on 2026-10-13; re-check
      # when python-jose or ecdsa publish a release, and drop the ignore then.
      #  - CVE-2026-85394 (python-jose 3.5.0): forging HS256 tokens needs the service's PUBLIC
      #    key used as the HMAC key and unrestricted `algorithms`. app/core/security.py decodes
      #    with algorithms=["HS256"] only and uses the JWT_SECRET_KEY string; no asymmetric
      #    keys or JWKs exist in the app.
      #  - PYSEC-2026-1325 (ecdsa 0.19.2, CVE-2024-23342): a timing side channel on EC *signing*
      #    (sign_digest). The app signs only HS256, never an EC algorithm; ecdsa is present
      #    solely as python-jose's transitive dependency.
      - name: Dependency vulnerability audit
        working-directory: backend
        run: >-
          uv run pip-audit --strict
          --ignore-vuln CVE-2026-85394
          --ignore-vuln PYSEC-2026-1325

      # Scored, threshold-gated checks distinct from the pytest step above
      # (constitution Principle V). Phase 1 gates matching-correctness
      # (threshold 1.0 - Principle II zero-tolerance) and qa-groundedness.
      - name: Run eval score-gate
        working-directory: backend
        run: uv run python -m evals.runner
