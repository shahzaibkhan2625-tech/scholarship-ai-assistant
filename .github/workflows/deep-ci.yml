name: Deep CI (live services)

on:
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC - start-of-week signal (not a weekend, when a failure
    # would go unnoticed) and a weekly touch that also helps keep Qdrant
    # Cloud's free-tier cluster from auto-suspending due to inactivity.
    - cron: "0 6 * * 1"

jobs:
  live-service-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholarship_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service container above - the DB-backed smoke test runs for real
      # instead of self-skipping. JWT_SECRET_KEY stays a CI-only dummy; nothing reads it
      # as a real secret.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scholarship_ci
      JWT_SECRET_KEY: ci-only-dummy-secret-0123456789abcdef
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run live Qdrant + Gemini smoke tests
        working-directory: backend
        run: uv run pytest -m smoke tests/smoke/
